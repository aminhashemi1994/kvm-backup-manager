###############################################################################
# Reference copy of the MAIN Telegraf config (/etc/telegraf/telegraf.conf).
#
# This is the pre-existing OS + 724 monitoring configuration, unchanged except
# for one added line: `namedrop = ["bm_*"]` on the :9273 output.
#
# The Backup Manager metrics are NOT configured here. They live in
# telegraf-backup-manager.conf, installed into /etc/telegraf/telegraf.d/, so the
# two pipelines stay independent and this file keeps doing exactly what it did
# before. Never add an [[inputs.prometheus]] block to this file — the metrics
# would then be collected twice, and the copy here would use metric_version 1.
###############################################################################

[agent]
  interval = "1m"
  omit_hostname = false

[global_tags]
  host = "$HOSTNAME"


#################### OS

[[inputs.cpu]]
  totalcpu = true

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]

[[inputs.mem]]

[[inputs.net]]
  ignore_protocol_stats = true
[[inputs.swap]]

[[inputs.system]]

################## 724 configuration

[[inputs.file]]
  files = ["/etc/telegraf/script/telegraf-requirements.json"]
  data_format = "json"
  interval = "1m"
  json_string_fields = ["Hostname", "IPAddress", "OS", "LastLoggedInUser", "LastLogginDate", "Users", "Connections"]
  name_override = "script"

[[inputs.file]]
  files = ["/etc/telegraf/script/network-sockets.json"]
  data_format = "json"
  interval = "1m"
  name_override = "script"

[[inputs.file]]
  files = ["/etc/telegraf/script/password-exp.json"]
  data_format = "json"
  name_override = "pass-expire"
  json_query = "key"
  tag_keys = ["User"]
  interval = "1h"

############################# Out

[[outputs.prometheus_client]]
  listen = ":9273"

  # Keep the Backup Manager metrics out of this output. They leave through the
  # dedicated :9274 output instead, which runs metric_version = 2 and so
  # preserves their names and types. Without this line they would ALSO be
  # rendered here at metric_version 1, arriving in Prometheus as a second,
  # mangled copy of every series.
  namedrop = ["bm_*"]
