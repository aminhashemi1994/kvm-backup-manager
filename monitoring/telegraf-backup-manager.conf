###############################################################################
# Backup Manager -> Telegraf -> Prometheus
#
# Drop this file in /etc/telegraf/telegraf.d/ and reload Telegraf. It adds an
# input that scrapes the controller and a SECOND prometheus_client output on
# :9274 dedicated to these metrics.
#
# Why a second output instead of reusing the existing :9273 —
#
#   Telegraf round-trips a scraped /metrics endpoint unchanged only when the
#   INPUT and the OUTPUT use the SAME metric_version (documented in the
#   prometheus input README, "Metric Format Configuration"). This pair uses
#   version 1, where the Prometheus metric name becomes the Telegraf
#   measurement name — which is what makes namepass/namedrop below able to
#   match "bm_*".
#
#   The existing :9273 output has no metric_version set (so also 1), but it is
#   left untouched all the same: mixing these metrics into an output that other
#   dashboards already depend on has no upside.
#
#   A separate output on :9274 keeps the two pipelines independent: the OS
#   metrics keep their current shape, and the backup metrics arrive unmangled.
#   Prometheus then has two targets on this host instead of one.
#
# If you would rather have a single port, delete this output and the
# namedrop/namepass lines — the :9273 output already runs at version 1 — but
# verify the existing dashboards afterwards, because that changes their
# pipeline too.
###############################################################################

[[inputs.prometheus]]
  ## Through the panel's existing nginx. The /api-backup/ location already
  ## rewrites to /api/ on the controller, and the controller serves this path
  ## outside its session auth — so this works with NO nginx change.
  urls = ["https://<panel-host>/api-backup/metrics/prometheus"]

  ## If you would rather expose the conventional path, add a /metrics location
  ## to nginx proxying to the controller and use this instead:
  # urls = ["https://<panel-host>/metrics"]
  ## Or bypass nginx entirely and scrape the controller directly:
  # urls = ["https://10.0.0.10:3000/metrics"]

  ## REQUIRED, and it must MATCH the output below — Telegraf only round-trips
  ## the exposition unchanged when both sides agree.
  ##
  ## Version 1: the Prometheus metric name becomes the Telegraf measurement
  ##            name, fields are generic (gauge/counter).
  ##              > bm_vm_backup_age_seconds,vm=web-01 gauge=5441
  ## Version 2: one shared "prometheus" measurement, metric name as field key.
  ##              > prometheus,vm=web-01 bm_vm_backup_age_seconds=5441
  ##
  ## Version 1 is used here because namepass/namedrop match on the MEASUREMENT
  ## name: under version 2 every series would be called "prometheus", the
  ## namepass = ["bm_*"] below would match nothing, and :9274 would serve an
  ## empty page while --test still looked perfectly healthy.
  metric_version = 1

  ## LMS allows no refresh faster than 1 minute. The controller renders from a
  ## 10s cached snapshot, so this costs nothing.
  interval = "60s"

  ## Matches METRICS_TOKEN in the controller's environment.
  ## Sends: Authorization: Bearer <token>
  bearer_token_string = "REPLACE_WITH_METRICS_TOKEN"

  ## The controller is behind nginx with an internal certificate.
  ##
  ## Deliberately true rather than pinning a CA: Go's TLS stack has no
  ## "verify the chain but tolerate expiry" mode, so verification would break
  ## this scrape the day the certificate expires — and one of the metrics this
  ## endpoint publishes is bm_certificate_expiry_timestamp_seconds. The alert
  ## that tells you the certificate died would die with it. Same reasoning the
  ## agents use to keep backing up through an expired certificate.
  insecure_skip_verify = true
  # tls_ca = "/etc/telegraf/ca.pem"

  ## Remove the tags Telegraf adds on its own:
  ##   host - names the Telegraf box, not the backup fleet.
  ##   url  - the scrape endpoint. Identical on every series, so it carries no
  ##          analytical value; the source is already identified by the
  ##          standard job and instance labels (LMS guideline 4-5, 4-6-3).
  ##
  ## NOTE: tagexclude, not tagdrop. tagdrop DISCARDS metrics whose tag matches,
  ## so `tagdrop { host = ["*"] }` would silently drop every single metric.
  ## tagexclude removes the tag and keeps the metric.
  tagexclude = ["host", "url"]


###############################################################################
# Dedicated output for the backup metrics.
###############################################################################
[[outputs.prometheus_client]]
  listen = ":9274"
  path = "/metrics"

  ## REQUIRED, and must equal the input's metric_version above.
  metric_version = 1

  ## Only the controller's metrics. With metric_version = 1 the measurement
  ## name IS the metric name, so this matches bm_* directly.
  namepass = ["bm_*"]

  ## How long a series survives after Telegraf stops seeing it.
  ##
  ## The relay hides Prometheus's own staleness handling — Prometheus can no
  ## longer tell "the controller stopped reporting this VM" from "Telegraf is
  ## repeating the last value it saw". This is the replacement. Keep it well
  ## above the 60s input interval so one missed scrape does not blank the
  ## dashboards, and never set 0s (never expire): a decommissioned VM would
  ## report its final backup age forever and read as permanently overdue.
  expiration_interval = "5m"

  ## Leave false. True makes Telegraf stamp each sample with the time it
  ## scraped the controller, forcing Prometheus to accept a timestamp it did
  ## not choose; any hiccup in the relay then surfaces as out-of-order samples.
  ## False lets Prometheus apply its own scrape time, which is what every
  ## rate() and increase() in the dashboards assumes.
  export_timestamp = false


###############################################################################
# One change is still needed in the MAIN /etc/telegraf/telegraf.conf, so the
# backup metrics do not ALSO leave through the :9273 output as a duplicate
# copy. install-backup-metrics.sh makes it for you; by hand it is:
#
#   [[outputs.prometheus_client]]
#     listen = ":9273"
#     namedrop = ["bm_*"]        # <-- add this
#
###############################################################################
